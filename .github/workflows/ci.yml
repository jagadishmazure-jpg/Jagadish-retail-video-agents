name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install lint and optional detector deps
        run: pip install ruff==0.17.3 -r requirements-detector.txt
      - name: Lint
        run: ruff check .
      - name: Tests (prints real total)
        run: python scripts/count_tests.py
      - name: Synthetic demos
        run: |
          python -m retail_agents.pipeline
          python -m retail_agents.restaurant_demo
