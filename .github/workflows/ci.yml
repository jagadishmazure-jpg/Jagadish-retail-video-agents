name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install lint and optional detector deps
        run: pip install ruff==0.17.3 -r requirements-detector.txt
      - name: Lint
        run: ruff check .
      - name: Tests (prints real total)
        run: python scripts/count_tests.py
      - name: Synthetic demos
        run: |
          python -m retail_agents.pipeline
          python -m retail_agents.restaurant_demo
